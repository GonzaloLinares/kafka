apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{NAMESPACE}}

resources:
  {{RESOURCES}}

patches:
  # Use persistent storage in production
  - patch: |-
      - op: replace
        path: /spec/kafka/storage
        value:
          type: persistent-claim
          size: {{SIZE}}
          deleteClaim: false
    target:
      kind: Kafka
      name: kafka-cluster

commonLabels:
  environment: prod
  strimzi.io/cluster: kafka-cluster

