apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka-infra
  labels:
    app.kubernetes.io/part-of: kafka-infra
spec:
  replicas: 3
  roles: {{LISTA_ROLES}}
  storage:
    type: ephemeral
  resources:
    requests:
      memory: {{MEMORY_REQUEST}}
      cpu: {{CPU_REQUEST}}
    limits:
      memory: {{MEMORY_LIMIT}}
      cpu: {{CPU_LIMIT}}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{NOMBRE}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/part-of: kafka-infra
  annotations:
    {{ANNOTATIONS}}
spec:
  kafka:
    version: {{VERSION}}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
