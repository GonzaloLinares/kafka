apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: products
  namespace: kafka-infra
  labels:
    app.kubernetes.io/part-of: kafka-infra
spec:
  partitions: {{PARTICIONES}}
  replicas: {{REPLICAS}}
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: clients
  namespace: kafka-infra
  labels:
    app.kubernetes.io/part-of: kafka-infra
spec:
  partitions: {{PARTICIONES}}
  replicas: {{REPLICAS}}
  config:
    cleanup.policy: compact
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: positions
  namespace: kafka-infra
  labels:
    app.kubernetes.io/part-of: kafka-infra
spec:
  partitions: {{PARTICIONES}}
  replicas: {{REPLICAS}}
  config:
    cleanup.policy: compact

